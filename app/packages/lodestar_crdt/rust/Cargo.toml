[package]
name = "lodestar_crdt"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
yrs = "0.28.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

