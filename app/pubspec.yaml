name: lodestar
description: "Lodestar: ИИ-кампус для вуза."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.8
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  file_saver: ^0.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  lodestar_crdt:
    path: packages/lodestar_crdt
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
