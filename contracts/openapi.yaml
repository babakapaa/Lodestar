    post:
      tags: [files]
      operationId: createFile
      summary: Начать загрузку файла
      description: |
        Сервер создаёт запись и отдаёт подписанную ссылку. Приложение отправляет содержимое прямо в хранилище запросом upload.method на upload.url с заголовками upload.headers и ровно size байт, затем вызывает /v1/files/{id}/complete.
        Наибольший размер задаёт вуз настройкой core.files.max_file_mb, иначе ответ 413 file_too_large. Незавершённые загрузки удаляются через сутки.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileInput"
      responses:
        "201":
          description: Запись создана, можно загружать
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedFile"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
