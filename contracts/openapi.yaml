          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/notes/sources/{id}:
    delete:
      tags: [notes]
      operationId: deleteSource
      summary: Удалить источник
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Готово
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/notes/lookup:
    post:
      tags: [notes]
      operationId: lookupSource
      summary: Найти описание источника по DOI или ссылке
      description: По DOI сервер спрашивает Crossref, по ссылке читает метаданные страницы. Адреса внутренних сетей сервер не открывает. Результат не сохраняется, его можно поправить и сохранить.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceLookupInput"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFields"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/navigator/dialogs:
    get:
      tags: [navigator]
      operationId: listDialogs
      summary: Мои диалоги с навигатором
      description: Без параметров возвращает все диалоги, с scopeKind и scopeId только диалоги этого задания.
      security:
        - bearer: []
      parameters:
        - name: scopeKind
          in: query
          schema:
            type: string
        - name: scopeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dialog"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [navigator]
      operationId: createDialog
      summary: Начать диалог
      description: id создаёт приложение, повтор с тем же id возвращает тот же диалог. Диалог видит только его владелец.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialogInput"
      responses:
        "200":
          description: Диалог уже был создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogDetails"
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogDetails"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/navigator/dialogs/{id}:
    get:
      tags: [navigator]
      operationId: getDialog
      summary: Диалог с сообщениями
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogDetails"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [navigator]
      operationId: deleteDialog
      summary: Удалить диалог
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/navigator/dialogs/{id}/messages:
    post:
      tags: [navigator]
      operationId: askNavigator
      summary: Задать вопрос или попросить ещё подсказку
      description: |
        key защищает от повторной отправки: повтор с тем же key возвращает прежний ответ без нового запроса к модели.
        С заголовком Accept text/event-stream ответ приходит потоком событий delta с полем text, затем answer с Answer или error с кодом.
        Тип запроса определяет классификатор. Если он ошибся, студент передаёт intent сам, кроме closed.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Ответ на этот key уже был или пришёл потоком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
            text/event-stream:
              schema:
                type: string
        "201":
          description: Ответ готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Токен доступа из /v1/auth/token
  parameters:
    After:
      name: after
      in: query
      description: Номер последнего полученного события
      schema:
        type: integer
        format: int64
        minimum: 0
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      description: Область. Пусто или tenant означает весь вуз, иначе вид:id, например group:42
      schema:
        type: string
        examples: ["group:42"]
    Tenant:
      name: tenant
      in: path
      required: true
      description: Короткое имя вуза
      schema:
        type: string
        examples: [kaznu]
    Provider:
      name: provider
      in: path
      required: true
      description: Короткое имя способа входа
      schema:
        type: string
        examples: [microsoft]
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Meta:
      type: object
      required: [version, modules]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
    ModuleInfo:
      type: object
      required: [name, version, optional]
      properties:
        optional:
          type: boolean
        name:
          type: string
          examples: [study]
        version:
          type: string
          examples: ["1"]
    ProviderInfo:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          examples: [microsoft]
        displayName:
          type: string
          examples: [Microsoft]
    TokenRequest:
      type: object
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Сколько секунд живёт токен доступа
    User:
      type: object
      required: [id, tenantId, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Это сессия того устройства, с которого пришёл запрос
    Role:
      type: object
      required: [id, name, color, icon, position, permissions, default]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Пусто или #RRGGBB
        icon:
          type: string
        position:
          type: integer
          description: Чем больше, тем выше роль. У роли по умолчанию 0
        permissions:
          type: array
          items:
            type: string
        default:
          type: boolean
          description: Роль, которая есть у всех
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        permissions:
          type: array
          items:
            type: string
    MoveInput:
      type: object
      required: [position]
      properties:
        position:
          type: integer
    RoleAssignment:
      type: object
      required: [id, roleId, userId, scope, expiresAt, grantedBy, grantedAt]
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
        grantedBy:
          type: [string, "null"]
          format: uuid
        grantedAt:
          type: string
          format: date-time
    AssignInput:
      type: object
      required: [roleId, userId]
      properties:
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    Override:
      type: object
      required: [roleId, allow, deny]
      properties:
        roleId:
          type: string
          format: uuid
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    OverrideInput:
      type: object
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    Unit:
      type: object
      required: [id, parentId, kind, name, code, archivedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          description: Вид подразделения, вуз выбирает сам, например faculty, department, stream, group
          examples: [faculty]
        name:
          type: string
        code:
          type: [string, "null"]
          description: Код из системы вуза для импорта
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    UnitDetails:
      allOf:
        - $ref: "#/components/schemas/Unit"
        - type: object
          required: [path]
          properties:
            path:
              type: array
              description: Родители от корня
              items:
                $ref: "#/components/schemas/Unit"
    UnitInput:
      type: object
      required: [kind, name]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
          description: Только при создании, перенос через move
        kind:
          type: string
        name:
          type: string
        code:
          type: [string, "null"]
    UnitMoveInput:
      type: object
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
    UnitMember:
      type: object
      required: [userId, displayName, email, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        joinedAt:
          type: string
          format: date-time
    UnitEvent:
      type: object
      required: [id, actorId, action, data, at]
      properties:
        id:
          type: integer
        actorId:
          type: [string, "null"]
          format: uuid
        action:
          type: string
          enum: [created, updated, moved, archived, restored, member_added, member_removed]
        data:
          type: object
        at:
          type: string
          format: date-time
    ImportReport:
      type: object
      required: [created, updated, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: object
            required: [line, code]
            properties:
              line:
                type: integer
              code:
                type: string
                enum: [missing_parent, invalid_unit, cycle, missing_unit, unknown_user, ambiguous_user]
    Contact:
      type: object
      required: [kind, value, public]
      properties:
        kind:
          type: string
          examples: [telegram]
        value:
          type: string
        public:
          type: boolean
          description: Виден ли контакт другим
    Profile:
      type: object
      required: [userId, displayName, about, contacts]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        about:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
          description: Пусто означает имя из учётной записи вуза
        about:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
    Definition:
      type: object
      required: [key, type, default]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, integer, text, choice, time_zone]
        options:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        maxLength:
          type: integer
        default: {}
    SettingValue:
      type: object
      required: [key, value, set]
      properties:
        key:
          type: string
        value: {}
        set:
          type: boolean
          description: false, если значение по умолчанию
    ValueInput:
      type: object
      required: [value]
      properties:
        value: {}
    ModuleState:
      type: object
      required: [name, version, optional, enabled]
      properties:
        name:
          type: string
        version:
          type: string
        optional:
          type: boolean
        enabled:
          type: boolean
    ModuleInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    Event:
      type: object
      required: [id, type, payload, at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          examples: [core.notification]
        payload: {}
        at:
          type: string
          format: date-time
    EventsPage:
      type: object
      required: [events, more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        more:
          type: boolean
          description: true, если событий больше и нужно запросить следующую страницу
    Notification:
      type: object
      required: [id, type, params, link, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        params:
          type: object
          description: Данные для текста. Текст по типу подставляет приложение.
        link:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
    UnreadCount:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
    NotificationType:
      type: object
      required: [key, required, names, texts]
      properties:
        key:
          type: string
          examples: [study.deadline]
        required:
          type: boolean
        names:
          type: object
          description: Название типа по языкам
          additionalProperties:
            type: string
        texts:
          type: object
          description: Шаблоны заголовка и текста по языкам
          additionalProperties:
            $ref: "#/components/schemas/NotificationText"
    NotificationText:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
    NotificationChannels:
      type: object
      required: [type, required, inApp, push, email]
      properties:
        type:
          type: string
        required:
          type: boolean
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
    NotificationChannelsInput:
      type: object
      required: [inApp, push, email]
      properties:
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
    File:
      type: object
      required: [id, ownerId, name, contentType, size, status, createdAt, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, ready]
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type: [string, "null"]
          format: date-time
    FileInput:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Имя без косых черт, прямых и обратных
        contentType:
          type: string
          description: По умолчанию application/octet-stream
        size:
          type: integer
          format: int64
