          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteVersionContent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/notes/{id}/members:
    get:
