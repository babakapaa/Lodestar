  /v1/navigator/dialogs/{id}/messages:
    post:
      tags: [navigator]
      operationId: askNavigator
      summary: Задать вопрос или попросить ещё подсказку
      description: |
        key защищает от повторной отправки: повтор с тем же key возвращает прежний ответ без нового запроса к модели.
        С заголовком Accept text/event-stream приходят события stage с полем stage (search, write, check), затем answer с Answer или error с кодом.
        Если у контекста есть курс, навигатор ищет фрагменты в материалах курса. Перед отправкой ответ проверяется: цитаты должны дословно быть во фрагменте, ссылки [n] вести на найденный фрагмент, а в учебном режиме ответ не должен выдавать готовое решение. Неподтверждённые предложения убираются.
        Тип запроса определяет классификатор. Если он ошибся, студент передаёт intent сам, кроме closed.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Ответ на этот key уже был или пришёл потоком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
            text/event-stream:
              schema:
                type: string
        "201":
          description: Ответ готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
