components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Токен доступа из /v1/auth/token
  parameters:
    After:
      name: after
      in: query
      description: Номер последнего полученного события
      schema:
        type: integer
        format: int64
        minimum: 0
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      description: Область. Пусто или tenant означает весь вуз, иначе вид:id, например group:42
      schema:
        type: string
        examples: ["group:42"]
    Tenant:
      name: tenant
      in: path
      required: true
      description: Короткое имя вуза
      schema:
        type: string
        examples: [kaznu]
    Provider:
      name: provider
      in: path
      required: true
      description: Короткое имя способа входа
      schema:
        type: string
        examples: [microsoft]
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Meta:
      type: object
      required: [version, modules]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
    ModuleInfo:
      type: object
      required: [name, version, optional]
      properties:
        optional:
          type: boolean
        name:
          type: string
          examples: [study]
        version:
          type: string
          examples: ["1"]
    ProviderInfo:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          examples: [microsoft]
        displayName:
          type: string
          examples: [Microsoft]
    TokenRequest:
      type: object
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token, launch_ticket]
        code:
          type: string
        ticket:
          type: string
          description: Одноразовый билет из входа через LMS (grantType launch_ticket)
        codeVerifier:
          type: string
        redirectUri:
          type: string
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Сколько секунд живёт токен доступа
    User:
      type: object
      required: [id, tenantId, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Это сессия того устройства, с которого пришёл запрос
    Role:
      type: object
      required: [id, name, color, icon, position, permissions, default]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Пусто или #RRGGBB
        icon:
          type: string
        position:
          type: integer
          description: Чем больше, тем выше роль. У роли по умолчанию 0
        permissions:
          type: array
          items:
            type: string
        default:
          type: boolean
          description: Роль, которая есть у всех
