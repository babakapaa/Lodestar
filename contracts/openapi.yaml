        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: kind
          in: query
          description: Где искать, можно несколько раз. По умолчанию везде.
          schema:
            type: array
            items:
              type: string
              examples: [people, units]
