    post:
      tags: [files]
      operationId: completeFile
      summary: Сообщить, что содержимое загружено
      description: Сервер проверяет, что содержимое есть в хранилище и его размер совпадает. Иначе 409 file_not_uploaded или file_size_mismatch.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Файл готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/files/{id}/download:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Ссылка на скачивание, действует 5 минут
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownload"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices:
    get:
      tags: [live]
      operationId: listDevices
      summary: Мои устройства для push
      security:
        - bearer: []
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [live]
      operationId: registerDevice
      summary: Подключить устройство к push или обновить его
      description: Тот же токен на другом аккаунте переносит устройство к новому владельцу. Перед выходом из аккаунта приложение удаляет устройство.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices/{id}:
    delete:
      tags: [live]
      operationId: removeDevice
      summary: Отключить устройство от push
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Готово
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Найти людей, подразделения и объекты модулей
      description: Ищет по части слова, терпит опечатки, не различает «е» и «ё». Модуль, выключенный вузом, в поиске не участвует. Каждый модуль сам отдаёт только то, что человек вправе видеть.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: kind
          in: query
          description: Где искать, можно несколько раз. По умолчанию везде.
          schema:
            type: array
            items:
              type: string
              examples: [people, units]
          explode: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Готово, лучшие совпадения сверху
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/search/kinds:
    get:
      tags: [search]
      operationId: listSearchKinds
      summary: Где можно искать в этом вузе
      security:
        - bearer: []
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Журнал действий, новые сверху, по 50
      description: Нужно право core.audit.view. Записи старше срока из настройки core.audit_retention_days удаляются.
      security:
        - bearer: []
      parameters:
        - name: before
          in: query
          description: id последней записи прошлой страницы
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: action
          in: query
          description: Действие или его начало, например core.role
          schema:
            type: string
        - name: actor
          in: query
          description: Кто сделал
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/export:
    get:
      tags: [privacy]
      operationId: exportMyData
      summary: Скачать все свои данные одним ZIP-архивом
      description: В архиве export.json с оглавлением, по файлу JSON на каждый раздел (ядро и модули) и мои загруженные файлы в папке files.
      security:
        - bearer: []
      responses:
        "200":
          description: Архив
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/deletion:
    get:
      tags: [privacy]
      operationId: getDeletion
      summary: Запрошено ли удаление аккаунта и когда оно произойдёт
      security:
        - bearer: []
      responses:
        "200":
          description: Удаление запрошено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [privacy]
      operationId: requestDeletion
      summary: Запросить удаление аккаунта
      description: |
        Аккаунт и все данные удаляются через core.deletion_grace_days дней (задаёт вуз). До этого удаление можно отменить. Повторный запрос не сдвигает срок.
        Если вуз выключил самостоятельное удаление (core.self_deletion), ответ 403 deletion_by_university.
      security:
        - bearer: []
      responses:
        "200":
          description: Удаление запланировано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "403":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [privacy]
      operationId: cancelDeletion
      summary: Отменить удаление аккаунта
      security:
        - bearer: []
      responses:
        "204":
          description: Готово
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Токен доступа из /v1/auth/token
  parameters:
    After:
      name: after
      in: query
      description: Номер последнего полученного события
      schema:
        type: integer
        format: int64
        minimum: 0
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      description: Область. Пусто или tenant означает весь вуз, иначе вид:id, например group:42
      schema:
        type: string
        examples: ["group:42"]
    Tenant:
      name: tenant
      in: path
      required: true
      description: Короткое имя вуза
      schema:
        type: string
        examples: [kaznu]
    Provider:
      name: provider
      in: path
      required: true
      description: Короткое имя способа входа
      schema:
        type: string
        examples: [microsoft]
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Meta:
      type: object
      required: [version, modules]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
    ModuleInfo:
      type: object
      required: [name, version, optional]
      properties:
        optional:
          type: boolean
        name:
          type: string
          examples: [study]
        version:
          type: string
          examples: ["1"]
    ProviderInfo:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          examples: [microsoft]
        displayName:
          type: string
          examples: [Microsoft]
    TokenRequest:
      type: object
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Сколько секунд живёт токен доступа
    User:
      type: object
      required: [id, tenantId, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Это сессия того устройства, с которого пришёл запрос
    Role:
      type: object
      required: [id, name, color, icon, position, permissions, default]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Пусто или #RRGGBB
        icon:
          type: string
        position:
          type: integer
          description: Чем больше, тем выше роль. У роли по умолчанию 0
        permissions:
          type: array
          items:
            type: string
        default:
          type: boolean
          description: Роль, которая есть у всех
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        permissions:
          type: array
          items:
            type: string
    MoveInput:
      type: object
      required: [position]
      properties:
        position:
          type: integer
    Assignment:
      type: object
      required: [id, roleId, userId, scope, expiresAt, grantedBy, grantedAt]
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
        grantedBy:
          type: [string, "null"]
          format: uuid
        grantedAt:
          type: string
          format: date-time
    AssignInput:
      type: object
      required: [roleId, userId]
      properties:
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    Override:
      type: object
      required: [roleId, allow, deny]
      properties:
        roleId:
          type: string
          format: uuid
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    OverrideInput:
      type: object
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    Unit:
      type: object
      required: [id, parentId, kind, name, code, archivedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          description: Вид подразделения, вуз выбирает сам, например faculty, department, stream, group
          examples: [faculty]
        name:
          type: string
        code:
          type: [string, "null"]
          description: Код из системы вуза для импорта
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    UnitDetails:
      allOf:
        - $ref: "#/components/schemas/Unit"
        - type: object
          required: [path]
          properties:
            path:
              type: array
              description: Родители от корня
              items:
                $ref: "#/components/schemas/Unit"
    UnitInput:
      type: object
      required: [kind, name]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
          description: Только при создании, перенос через move
        kind:
          type: string
        name:
          type: string
        code:
          type: [string, "null"]
    UnitMoveInput:
      type: object
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
    UnitMember:
      type: object
      required: [userId, displayName, email, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        joinedAt:
          type: string
          format: date-time
    UnitEvent:
      type: object
      required: [id, actorId, action, data, at]
      properties:
        id:
          type: integer
        actorId:
          type: [string, "null"]
          format: uuid
        action:
          type: string
          enum: [created, updated, moved, archived, restored, member_added, member_removed]
        data:
          type: object
        at:
          type: string
          format: date-time
    ImportReport:
      type: object
      required: [created, updated, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: object
            required: [line, code]
            properties:
              line:
                type: integer
              code:
                type: string
                enum: [missing_parent, invalid_unit, cycle, missing_unit, unknown_user, ambiguous_user]
    Contact:
      type: object
      required: [kind, value, public]
      properties:
        kind:
          type: string
          examples: [telegram]
        value:
          type: string
        public:
          type: boolean
          description: Виден ли контакт другим
    Profile:
      type: object
      required: [userId, displayName, about, contacts]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        about:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
          description: Пусто означает имя из учётной записи вуза
        about:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
    Definition:
      type: object
      required: [key, type, default]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, integer, text, choice, time_zone]
        options:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        maxLength:
          type: integer
        default: {}
    SettingValue:
      type: object
      required: [key, value, set]
      properties:
        key:
          type: string
        value: {}
        set:
          type: boolean
          description: false, если значение по умолчанию
    ValueInput:
      type: object
      required: [value]
      properties:
        value: {}
    ModuleState:
      type: object
      required: [name, version, optional, enabled]
      properties:
        name:
          type: string
        version:
          type: string
        optional:
          type: boolean
        enabled:
          type: boolean
    ModuleInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    Event:
      type: object
      required: [id, type, payload, at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          examples: [core.notification]
        payload: {}
        at:
          type: string
          format: date-time
    EventsPage:
      type: object
      required: [events, more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        more:
          type: boolean
          description: true, если событий больше и нужно запросить следующую страницу
    Notification:
      type: object
      required: [id, type, params, link, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        params:
          type: object
          description: Данные для текста. Текст по типу подставляет приложение.
        link:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
    UnreadCount:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
    NotificationChannels:
      type: object
      required: [type, required, inApp, push, email]
      properties:
        type:
          type: string
        required:
          type: boolean
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
    NotificationChannelsInput:
      type: object
      required: [inApp, push, email]
      properties:
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
    File:
      type: object
      required: [id, ownerId, name, contentType, size, status, createdAt, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, ready]
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type: [string, "null"]
          format: date-time
    FileInput:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Имя без косых черт, прямых и обратных
        contentType:
          type: string
          description: По умолчанию application/octet-stream
        size:
          type: integer
          format: int64
          minimum: 1
    Upload:
      type: object
      required: [url, method, headers, expiresAt]
      properties:
        url:
          type: string
        method:
          type: string
          examples: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CreatedFile:
      type: object
      required: [file, upload]
      properties:
        file:
          $ref: "#/components/schemas/File"
        upload:
          $ref: "#/components/schemas/Upload"
    FileDownload:
      type: object
      required: [url]
      properties:
        url:
          type: string
    Device:
      type: object
      required: [id, platform, name, language, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios, web]
        name:
          type: string
        language:
          type: string
          description: Язык устройства, для текста push, если человек не выбрал язык сам
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    DeviceInput:
      type: object
      required: [platform, token]
      properties:
        platform:
          type: string
          enum: [android, ios, web]
        token:
          type: string
          description: Токен Firebase Cloud Messaging
          maxLength: 4096
        name:
          type: string
          maxLength: 100
        language:
          type: string
          examples: [kk-KZ]
    SearchHit:
      type: object
      required: [kind, id, title, subtitle, link, score]
      properties:
        kind:
          type: string
          examples: [people]
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        link:
          type: string
          description: Путь в приложении
          examples: [/people/6f1c]
        score:
          type: number
    AuditEntry:
      type: object
      required: [id, actorId, action, targetKind, targetId, details, at]
      properties:
        id:
          type: integer
          format: int64
        actorId:
          type: [string, "null"]
          format: uuid
          description: null, если изменение сделано с сервера, например через lodestarctl
        action:
          type: string
          examples: [core.role.assigned]
        targetKind:
          type: string
          examples: [role, user, setting, module]
        targetId:
          type: string
        details:
          type: object
        at:
          type: string
          format: date-time
    Deletion:
      type: object
      required: [requestedAt, dueAt]
      properties:
        requestedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Машинный код ошибки. Текст для человека подставляет приложение.
          examples: [not_found]
