        scopeKind:
          type: string
        scopeId:
          type: string
        query:
          type: string
        sources:
          type: array
          items:
            type: object
            required: [title, reference, url]
            properties:
              title:
                type: string
              reference:
                type: string
              url:
                type: string
        createdAt:
          type: string
          format: date-time
    Support:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: string
          description: Пусто, если вуз не указал контакты
    ChatOrigin:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          maxLength: 60
          description: Откуда список людей, например study.course
        id:
          type: string
          maxLength: 100
    Chat:
      type: object
      required: [id, kind, title, about, origin, peerId, role, muted, request, seq, rev, readSeq, unread, memberCount, last, archivedAt, createdAt, changedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [direct, group, channel]
        title:
          type: string
        about:
          type: string
        origin:
          oneOf:
            - $ref: "#/components/schemas/ChatOrigin"
            - type: "null"
        peerId:
          type: [string, "null"]
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        muted:
          type: boolean
        request:
          type: boolean
          description: Первое сообщение от незнакомого, лежит в «Запросах» и не звонит
        seq:
          type: integer
          format: int64
          description: Номер последнего сообщения
        rev:
          type: integer
          format: int64
          description: Номер последнего изменения сообщений
        readSeq:
          type: integer
          format: int64
        unread:
          type: integer
          format: int64
        memberCount:
          type: integer
        last:
          oneOf:
            - $ref: "#/components/schemas/ChatMessage"
            - type: "null"
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        changedAt:
          type: string
          format: date-time
    ChatMember:
      type: object
      required: [userId, displayName, role, synced, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        synced:
          type: boolean
          description: Пришёл из списка курса
        joinedAt:
          type: string
          format: date-time
    ChatDetails:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          required: [members, peerReadSeq]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/ChatMember"
            peerReadSeq:
              type: [integer, "null"]
              format: int64
              description: В личном чате, до какого сообщения прочитал собеседник
    ChatInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [group, channel]
        title:
          type: string
          maxLength: 200
          description: Обязательно без origin, с origin по умолчанию название курса
        about:
          type: string
          maxLength: 2000
        memberIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        origin:
          $ref: "#/components/schemas/ChatOrigin"
    ChatUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        about:
          type: string
          maxLength: 2000
    DirectInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    MembersInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
    MuteInput:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean
    ReadInput:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
    ChatMessage:
      type: object
      required: [id, chatId, seq, rev, authorId, clientId, text, replyTo, mentions, files, views, deleted, editedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        rev:
          type: integer
          format: int64
        authorId:
          type: [string, "null"]
          format: uuid
          description: Пусто, если автор удалил аккаунт
        clientId:
          type: [string, "null"]
        text:
          type: string
          description: Пусто у удалённого сообщения
        replyTo:
          type: [integer, "null"]
          format: int64
        mentions:
          type: array
          items:
            type: string
            format: uuid
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        views:
          type: [integer, "null"]
          description: Только в канале, число прочитавших без имён
        deleted:
          type: boolean
        editedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    ChatMessageInput:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 100
        text:
          type: string
          maxLength: 4000
          description: Может быть пустым, если есть файлы
        replyTo:
          type: integer
          format: int64
          minimum: 1
        mentions:
          type: array
          maxItems: 50
          description: Упомянутые участники, остальные отбрасываются
          items:
            type: string
            format: uuid
        fileIds:
          type: array
          maxItems: 10
          description: Свои загруженные файлы
          items:
            type: string
            format: uuid
    ChatMessageEdit:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    MessagePage:
      type: object
      required: [messages, more]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        more:
          type: boolean
    ChatReportInput:
      type: object
      required: [chatId, messageIds, reason]
      properties:
        chatId:
          type: string
          format: uuid
        messageIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ChatReport:
      type: object
      required: [id, chatId, chatTitle, reporterId, reason, messages, createdAt, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: [string, "null"]
          format: uuid
        chatTitle:
          type: string
        reporterId:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        messages:
          type: array
          items:
            type: object
            required: [seq, authorId, authorName, text, createdAt]
            properties:
              seq:
                type: integer
                format: int64
              authorId:
                type: [string, "null"]
                format: uuid
              authorName:
                type: string
              text:
                type: string
              createdAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
