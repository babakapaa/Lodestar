openapi: 3.1.0
info:
  title: Lodestar API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: system
    description: Состояние сервера и сведения о нём
  - name: auth
    description: Вход через систему вуза и сессии на устройствах
  - name: access
    description: Роли и права как в Discord
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Проверка, что сервер жив
      responses:
        "200":
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Готов ли сервер принимать запросы (база доступна)
      responses:
        "200":
          description: Сервер готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервер не готов, код ошибки not_ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: Версия сервера и подключённые модули
      responses:
        "200":
          description: Сведения о сервере
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/{tenant}/providers:
    get:
      tags: [auth]
      operationId: listProviders
      summary: Способы входа, которые подключил вуз
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Список способов входа
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/{tenant}/{provider}/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: Начать вход, приложение открывает этот адрес в браузере
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Provider"
        - name: redirect_uri
          in: query
          required: true
          description: Адрес возврата в приложение из списка LODESTAR_APP_REDIRECTS
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          description: PKCE S256 от code_verifier приложения
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: device
          in: query
          description: Название устройства для списка сессий
          schema:
            type: string
      responses:
        "302":
          description: Переход на страницу входа вуза
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/{tenant}/{provider}/callback:
    get:
      tags: [auth]
      operationId: finishLogin
      summary: Возврат от провайдера вуза
      description: Перенаправляет на redirect_uri приложения с параметром code или error=login_failed.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Provider"
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Возврат в приложение
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/token:
    post:
      tags: [auth]
      operationId: issueTokens
      summary: Обменять одноразовый код или токен обновления на новую пару токенов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Код или токен неверен или устарел, код invalid_grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выйти на этом устройстве
      security:
        - bearer: []
      responses:
        "204":
          description: Сессия закрыта
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь
      security:
        - bearer: []
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Устройства, на которых пользователь вошёл
      security:
        - bearer: []
      responses:
        "200":
          description: Список сессий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Выйти на другом устройстве
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сессия закрыта
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/permissions:
    get:
      tags: [access]
      operationId: listPermissionCatalog
      summary: Все права, которые знают ядро и модули
      security:
        - bearer: []
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/permissions:
    get:
      tags: [access]
      operationId: getMyPermissions
      summary: Мои права в области
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/roles:
    get:
      tags: [access]
      operationId: listRoles
      summary: Роли вуза сверху вниз
      security:
        - bearer: []
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [access]
      operationId: createRole
      summary: Создать роль сразу под своей высшей ролью
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/roles/{id}:
    put:
      tags: [access]
      operationId: updateRole
      summary: Изменить роль ниже своей
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [access]
      operationId: deleteRole
      summary: Удалить роль ниже своей
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Готово
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/roles/{id}/move:
    post:
      tags: [access]
      operationId: moveRole
      summary: Поставить роль на новое место в списке
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "204":
          description: Готово
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/roles/{id}/preview:
    get:
      tags: [access]
      operationId: previewRole
      summary: Права, которые увидит человек только с этой ролью
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/users/{id}/roles:
    get:
      tags: [access]
      operationId: listUserRoles
      summary: Роли человека
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/role-assignments:
    post:
      tags: [access]
      operationId: assignRole
      summary: Выдать роль человеку в области, можно на срок
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/role-assignments/{id}:
    delete:
      tags: [access]
      operationId: unassignRole
      summary: Снять роль
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Готово
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/overrides:
    get:
      tags: [access]
      operationId: listOverrides
      summary: Переопределения прав в области
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Override"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/overrides/{role}:
    put:
      tags: [access]
      operationId: setOverride
      summary: Разрешить или запретить права роли в области, пустые списки убирают переопределение
      security:
        - bearer: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Scope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideInput"
      responses:
        "204":
          description: Готово
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Токен доступа из /v1/auth/token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      description: Область. Пусто или tenant означает весь вуз, иначе вид:id, например group:42
      schema:
        type: string
        examples: ["group:42"]
    Tenant:
      name: tenant
      in: path
      required: true
      description: Короткое имя вуза
      schema:
        type: string
        examples: [kaznu]
    Provider:
      name: provider
      in: path
      required: true
      description: Короткое имя способа входа
      schema:
        type: string
        examples: [microsoft]
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Meta:
      type: object
      required: [version, modules]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
    ModuleInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          examples: [study]
        version:
          type: string
          examples: ["1"]
    ProviderInfo:
      type: object
      required: [key, displayName]
      properties:
        key:
          type: string
          examples: [microsoft]
        displayName:
          type: string
          examples: [Microsoft]
    TokenRequest:
      type: object
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Сколько секунд живёт токен доступа
    User:
      type: object
      required: [id, tenantId, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Это сессия того устройства, с которого пришёл запрос
    Role:
      type: object
      required: [id, name, color, icon, position, permissions, default]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Пусто или #RRGGBB
        icon:
          type: string
        position:
          type: integer
          description: Чем больше, тем выше роль. У роли по умолчанию 0
        permissions:
          type: array
          items:
            type: string
        default:
          type: boolean
          description: Роль, которая есть у всех
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        permissions:
          type: array
          items:
            type: string
    MoveInput:
      type: object
      required: [position]
      properties:
        position:
          type: integer
    Assignment:
      type: object
      required: [id, roleId, userId, scope, expiresAt, grantedBy, grantedAt]
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
        grantedBy:
          type: [string, "null"]
          format: uuid
        grantedAt:
          type: string
          format: date-time
    AssignInput:
      type: object
      required: [roleId, userId]
      properties:
        roleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        scope:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    Override:
      type: object
      required: [roleId, allow, deny]
      properties:
        roleId:
          type: string
          format: uuid
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    OverrideInput:
      type: object
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Машинный код ошибки. Текст для человека подставляет приложение.
          examples: [not_found]
