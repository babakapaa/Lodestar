    Brief:
      type: object
      required: [kind, id, title, description, course, dueAt, mode]
      properties:
        kind:
          type: string
        id:
          type: string
        title:
          type: string
        description:
          type: string
        course:
          type: string
        dueAt:
          type: [string, "null"]
          format: date-time
        mode:
          $ref: "#/components/schemas/NavigatorMode"
    Dialog:
      type: object
      required: [id, scopeKind, scopeId, title, createdAt, changedAt]
      properties:
        id:
          type: string
          format: uuid
        scopeKind:
          type: string
          description: assignment или пусто
        scopeId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        changedAt:
          type: string
          format: date-time
    DialogInput:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        scopeKind:
          type: string
          maxLength: 30
        scopeId:
          type: string
          maxLength: 100
    DialogDetails:
      allOf:
        - $ref: "#/components/schemas/Dialog"
        - type: object
          required: [brief, messages]
          properties:
            brief:
              oneOf:
                - $ref: "#/components/schemas/Brief"
                - type: "null"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/NavigatorMessage"
    NavigatorMessage:
      type: object
      required: [seq, role, text, intent, step, lastStep, support, createdAt]
      properties:
        seq:
          type: integer
        role:
          type: string
          enum: [student, navigator]
        text:
          type: string
        intent:
          $ref: "#/components/schemas/Intent"
        step:
          $ref: "#/components/schemas/Step"
        lastStep:
          type: boolean
        support:
          type: string
          description: Контакты поддержки вуза. Заполнено, только если в вопросе были тревожные слова
        createdAt:
          type: string
          format: date-time
    MessageInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
        text:
          type: string
          maxLength: 8000
        intent:
          $ref: "#/components/schemas/Intent"
        more:
          type: boolean
          description: Ещё подсказку, следующая ступень лестницы
    Answer:
      type: object
      required: [question, reply]
      properties:
        question:
          $ref: "#/components/schemas/NavigatorMessage"
        reply:
          $ref: "#/components/schemas/NavigatorMessage"
