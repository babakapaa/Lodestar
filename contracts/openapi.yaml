      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteMember"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/notes/{id}/members/{user}:
