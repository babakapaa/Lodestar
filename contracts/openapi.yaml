  /v1/notes/sources:
    get:
      tags: [notes]
      operationId: listSources
      summary: Личная база источников
      description: Только свои источники. Хранятся зашифрованными и считаются в квоту заметок.
      security:
        - bearer: []
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [notes]
      operationId: saveSource
      summary: Добавить или изменить источник
      description: id создаёт устройство, поэтому источник можно добавить без сети. Повтор с тем же id обновляет запись.
      security:
        - bearer: []
      requestBody:
