  /v1/live:
    get:
      tags: [live]
      operationId: openLiveStream
      summary: WebSocket с живыми событиями
      description: |
        Сервер шлёт JSON-сообщения формата Event. Токен передаётся в заголовке Authorization или в параметре access_token, потому что браузер не умеет ставить заголовок для WebSocket.
        С параметром after сервер сначала досылает пропущенные события. Если пропущено слишком много или клиент не успевает читать, приходит событие core.resync с полем latest в payload: клиенту нужно перечитать данные и переподключиться с after=latest.
      security:
        - bearer: []
        - {}
      parameters:
        - $ref: "#/components/parameters/After"
        - name: access_token
          in: query
          schema:
            type: string
      responses:
        "101":
          description: Соединение открыто
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
