name: lodestar

services:
  server:
    build:
      context: ../server
      args:
        VERSION: ${LODESTAR_VERSION:-dev}
    environment:
      LODESTAR_HTTP_ADDR: ":8080"
      LODESTAR_DATABASE_URL: postgres://lodestar:${POSTGRES_PASSWORD}@postgres:5432/lodestar?sslmode=disable
    ports:
      - "${LODESTAR_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: lodestar
      POSTGRES_USER: lodestar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodestar -d lodestar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      - minio:/data
    restart: unless-stopped

volumes:
  postgres:
  nats:
  minio:
