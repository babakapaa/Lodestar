name: lodestar

services:
  server:
    build:
      context: ../server
      args:
        VERSION: ${LODESTAR_VERSION:-dev}
    environment:
      LODESTAR_HTTP_ADDR: ":8080"
      LODESTAR_DATABASE_URL: postgres://lodestar:${POSTGRES_PASSWORD}@postgres:5432/lodestar?sslmode=disable
      LODESTAR_PUBLIC_URL: ${LODESTAR_PUBLIC_URL:-http://localhost:8080}
      LODESTAR_SECRET_KEY: ${LODESTAR_SECRET_KEY:?set LODESTAR_SECRET_KEY in deploy/.env}
      LODESTAR_APP_REDIRECTS: ${LODESTAR_APP_REDIRECTS:-io.github.babakapaa.lodestar:/auth,http://localhost:43823/auth}
      LODESTAR_WEB_ORIGINS: ${LODESTAR_WEB_ORIGINS:-}
      LODESTAR_TRUSTED_PROXIES: ${LODESTAR_TRUSTED_PROXIES:-}
      LODESTAR_S3_ENDPOINT: http://minio:9000
      LODESTAR_S3_PUBLIC_ENDPOINT: ${LODESTAR_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      LODESTAR_S3_BUCKET: ${LODESTAR_S3_BUCKET:-lodestar}
      LODESTAR_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      LODESTAR_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LODESTAR_APP_URL: ${LODESTAR_APP_URL:-}
      LODESTAR_SMTP_ADDR: ${LODESTAR_SMTP_ADDR:-}
      LODESTAR_SMTP_USERNAME: ${LODESTAR_SMTP_USERNAME:-}
      LODESTAR_SMTP_PASSWORD: ${LODESTAR_SMTP_PASSWORD:-}
      LODESTAR_MAIL_FROM: ${LODESTAR_MAIL_FROM:-}
      LODESTAR_FCM_CREDENTIALS_FILE: ${LODESTAR_FCM_CREDENTIALS_FILE:-}
      LODESTAR_LIVEKIT_URL: ${LODESTAR_LIVEKIT_URL:-}
      LODESTAR_LIVEKIT_API_URL: ${LODESTAR_LIVEKIT_API_URL:-http://livekit:7880}
      LODESTAR_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LODESTAR_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LODESTAR_LLM_URL: ${LODESTAR_LLM_URL:-}
      LODESTAR_LLM_MODEL: ${LODESTAR_LLM_MODEL:-}
      LODESTAR_LLM_KEY: ${LODESTAR_LLM_KEY:-}
      LODESTAR_EMBED_URL: ${LODESTAR_EMBED_URL:-}
      LODESTAR_EMBED_MODEL: ${LODESTAR_EMBED_MODEL:-}
      LODESTAR_EMBED_KEY: ${LODESTAR_EMBED_KEY:-}
      LODESTAR_RERANK_URL: ${LODESTAR_RERANK_URL:-}
      LODESTAR_RERANK_MODEL: ${LODESTAR_RERANK_MODEL:-}
      LODESTAR_RERANK_KEY: ${LODESTAR_RERANK_KEY:-}
      LODESTAR_STT_URL: ${LODESTAR_STT_URL:-}
      LODESTAR_STT_MODEL: ${LODESTAR_STT_MODEL:-}
      LODESTAR_STT_KEY: ${LODESTAR_STT_KEY:-}
    ports:
      - "${LODESTAR_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  demo-idp:
    profiles: ["demo"]
    build:
      context: ../server
    entrypoint: ["/lodestar-demo-idp"]
    environment:
      DEMO_IDP_ISSUER: ${DEMO_IDP_ISSUER:-http://localhost:8090}
      DEMO_IDP_CLIENT_SECRET: ${DEMO_IDP_CLIENT_SECRET:-}
      DEMO_IDP_REDIRECTS: ${LODESTAR_PUBLIC_URL:-http://localhost:8080}/v1/auth/demo/demo/callback
    ports:
      - "${DEMO_IDP_PORT:-8090}:8090"
    restart: unless-stopped

  livekit:
    profiles: ["calls"]
    image: livekit/livekit-server:v1.8.4
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50200
          use_external_ip: true
        redis:
          address: livekit-redis:6379
        keys:
          ${LIVEKIT_API_KEY:-lodestar}: ${LIVEKIT_API_SECRET:-}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-lodestar}
          urls:
            - http://server:8080/v1/open/chat/livekit
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    depends_on:
      - livekit-redis
    restart: unless-stopped

  livekit-redis:
    profiles: ["calls"]
    image: redis:7.4-alpine
    restart: unless-stopped

  livekit-egress:
    profiles: ["calls"]
    image: livekit/egress:v1.9.0
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-lodestar}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
    depends_on:
      - livekit
      - livekit-redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: lodestar
      POSTGRES_USER: lodestar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodestar -d lodestar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats:/data
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    ports:
      - "${LODESTAR_S3_PORT:-9000}:9000"
    volumes:
      - minio:/data
    restart: unless-stopped

volumes:
  postgres:
  nats:
  minio:
