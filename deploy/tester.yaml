services:
  server:
    image: lodestar-tester
    build:
      context: ..
      dockerfile: deploy/tester.Dockerfile
    environment:
      LODESTAR_TESTER_MODE: "on"
      LODESTAR_WEB_DIR: /web
      LODESTAR_LLM_TIMEOUT: ${LODESTAR_LLM_TIMEOUT:-4m}
      LODESTAR_APP_REDIRECTS: io.github.babakapaa.lodestar:/auth,http://localhost:43823/auth,${LODESTAR_PUBLIC_URL:-http://localhost:8080}/auth.html,http://localhost:${LODESTAR_HTTP_PORT:-8080}/auth.html
      LODESTAR_SMTP_ADDR: mailpit:1025
      LODESTAR_MAIL_FROM: Lodestar <lodestar@demo.invalid>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  livekit:
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50200
          use_external_ip: false
          node_ip: ${LODESTAR_HOST_IP:-127.0.0.1}
        redis:
          address: livekit-redis:6379
        keys:
          ${LIVEKIT_API_KEY:-lodestar}: ${LIVEKIT_API_SECRET:-}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-lodestar}
          urls:
            - http://server:8080/v1/open/chat/livekit

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.5.7
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-models:
    profiles: ["ai"]
    image: ollama/ollama:0.5.7
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${LODESTAR_LLM_MODEL:-qwen2.5:3b} && ollama pull ${LODESTAR_EMBED_MODEL:-bge-m3}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  ollama:
