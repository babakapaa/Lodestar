services:
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/rendered/lodestar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rendered/htpasswd:/etc/nginx/htpasswd:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on:
      - server
    restart: unless-stopped

  certbot:
    profiles: ["proxy"]
    image: certbot/certbot:v3.0.1
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    restart: unless-stopped

  server:
    environment:
      LODESTAR_TRUSTED_PROXIES: 127.0.0.1/32,172.16.0.0/12
    ports: !override
      - "127.0.0.1:${LODESTAR_HTTP_PORT:-8080}:8080"

  minio:
    ports: !override
      - "127.0.0.1:${LODESTAR_S3_PORT:-9000}:9000"

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  livekit:
    ports: !override
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"

  ollama:
    mem_limit: 5g
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"

volumes:
  certs:
  acme:
